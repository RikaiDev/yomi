<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https: data: blob:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:"
    />
    <style>
      /* view.css is embedded by the Rust WebView builder. */
    </style>
  </head>
  <body>
    <div id="app" class="shell">
      <header class="top">
        <div class="brand">Yomi <small id="status"></small></div>
        <div class="top-actions">
          <button title="sync" data-action="sync" onclick="loadChats(true)">
            ↻</button
          ><button title="settings" data-action="settings" onclick="settings()">
            ⚙</button
          ><button title="quit" data-action="quit" onclick="send('quit')">
            ×
          </button>
        </div>
      </header>
      <aside class="left">
        <div class="account">
          <div id="avatar" class="avatar">YM</div>
          <div><strong id="name"></strong><small id="connection"></small></div>
        </div>
        <nav class="nav">
          <button
            id="nav-attention"
            class="active"
            onclick="setView('attention')"
          >
            <span data-i18n="attention"></span
            ><span id="attention-count" class="badge">0</span></button
          ><button id="nav-chats" onclick="setView('chats')">
            <span data-i18n="all_chats"></span></button
          ><button id="nav-yomi" onclick="showYomi()">
            <span data-i18n="yomi"></span></button
          ><button onclick="ambient()"><span data-i18n="ambient"></span></button
          ><button onclick="settings()">
            <span data-i18n="settings"></span>
          </button>
        </nav>
        <div class="footer">
          <span data-i18n="windows_app"></span><br /><span
            id="sync-label"
          ></span>
        </div>
      </aside>
      <section class="inbox">
        <div class="inbox-head">
          <h2 id="inbox-title"></h2>
          <input id="search" class="search" oninput="renderChats()" />
          <div class="filters">
            <button
              id="filter-attention"
              class="filter active"
              onclick="setView('attention')"
              data-i18n="priority"
            ></button
            ><button
              id="filter-all"
              class="filter"
              onclick="setView('chats')"
              data-i18n="all"
            ></button>
          </div>
        </div>
        <div id="chat-list" class="list"></div>
      </section>
      <main class="detail">
        <div id="detail-head" class="detail-head"></div>
        <div id="messages" class="messages"></div>
        <section id="briefing" class="briefing hidden"></section>
        <section id="yomi-panel" class="yomi-panel hidden"></section>
        <div id="composer" class="composer hidden">
          <div id="rich" class="rich hidden"></div>
          <div id="attachments" class="attachments hidden"></div>
          <div id="stickers" class="stickers hidden"></div>
          <div class="compose" id="dropzone">
            <div class="tools">
              <button title="attachment" onclick="chooseFile(false)">＋</button
              ><button title="camera" onclick="chooseFile(true)">▣</button
              ><button title="sticker" onclick="toggleStickers()">☺</button
              ><button title="voice" onclick="voice()">♩</button>
            </div>
            <textarea id="input" onkeydown="key(event)"></textarea
            ><button
              class="send"
              onclick="sendText()"
              data-i18n="send"
            ></button>
          </div>
          <input
            id="file"
            class="hidden"
            type="file"
            multiple
            onchange="stageFiles(event)"
          /><input
            id="camera-file"
            class="hidden"
            type="file"
            accept="image/*"
            capture="environment"
            onchange="stageFiles(event)"
          />
        </div>
      </main>
    </div>
    <div id="drawer" class="drawer hidden"></div>
    <div id="modal" class="modal hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="login" class="login hidden">
      <form class="card" onsubmit="login(event)">
        <h2 data-i18n="login_title"></h2>
        <p data-i18n="login_copy"></p>
        <select id="region">
          <option value="TW">TW +886</option>
          <option value="JP">JP +81</option>
          <option value="TH">TH +66</option>
          <option value="ID">ID +62</option>
          <option value="US">US +1</option></select
        ><input
          id="phone"
          type="tel"
          required
          placeholder="0912 345 678"
        /><button
          class="primary"
          id="login-button"
          data-i18n="login_continue"
        ></button
        ><button
          type="button"
          class="secondary"
          onclick="cancelLogin()"
          data-i18n="cancel"
        ></button>
        <p id="login-status"></p>
      </form>
    </div>
  </body>
</html>
