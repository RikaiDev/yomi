[package]
name = "yomi-desktop"
version = "0.5.0"
edition = "2021"
description = "AI-first personal communication workspace and tray companion for Yomi"

[lints.rust]
unsafe_code = "deny"

[dependencies]
tao = "0.31"
tray-icon = "0.19"
muda = "0.15"
notify-rust = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
wry = "0.56.1"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
